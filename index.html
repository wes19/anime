<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#120d24" />
  <meta name="description" content="AnimeKre, una nueva experiencia para descubrir y organizar tus animes favoritos. Próximamente." />
  <title>AnimeKre | Próximamente</title>
  <style>
    :root { color-scheme: dark; --purple:#8B5CF6; --bg:#120d24; --muted:#b7accf; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#fff; background:radial-gradient(ellipse at 50% 22%,#342052 0%,#1b1233 43%,var(--bg) 80%); display:flex; flex-direction:column; }
    header { padding:28px clamp(24px,7vw,100px); }
    .brand { display:inline-flex; align-items:center; gap:12px; font-size:22px; font-weight:800; letter-spacing:-.8px; }
    .mark { display:grid;place-items:center; width:42px;height:42px; border-radius:13px; background:#27183f; border:1px solid #6c43ae; font-size:21px;letter-spacing:-3px;padding-right:3px; }
    .mark span { color:var(--purple); }
    main { flex:1; display:flex; justify-content:center;align-items:center;text-align:center;padding:35px 22px 85px; }
    .hero { max-width:760px; }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; border:1px solid #63438a; border-radius:100px; padding:9px 16px; color:#d9c5ff; background:#ffffff08; font-size:13px; font-weight:600; letter-spacing:.4px; }
    .dot { height:7px;width:7px;background:var(--purple);border-radius:50%; }
    h1 { margin:25px 0 18px; font-size:clamp(48px,9vw,94px);letter-spacing:-.065em;line-height:1.06; }
    h1 span { color:var(--purple); }
    p { margin:0 auto;max-width:570px; font-size:clamp(16px,2.2vw,20px);line-height:1.75;color:var(--muted); }
    .line { width:72px;height:3px;background:var(--purple);border-radius:10px;margin:35px auto 0; }
    footer { text-align:center;padding:25px;color:#9788b1;font-size:13px;border-top:1px solid #ffffff12; }
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark" aria-hidden="true">A<span>K</span></div> AnimeKre</div></header>
  <main><section class="hero" aria-labelledby="title"><div class="eyebrow"><span class="dot"></span> UNA NUEVA EXPERIENCIA ESTÁ EN CAMINO</div><h1 id="title">Algo increíble<br /><span>está por llegar.</span></h1><p>Estamos creando AnimeKre, un espacio para descubrir, explorar y organizar los animes que más te gustan.</p><div class="line" aria-hidden="true"></div></section></main>
  <footer>© 2026 AnimeKre · Próximamente</footer>
</body>
</html>
